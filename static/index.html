<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Global Pathways</title>
<style>
:root{--bg:#f7f8fa;--fg:#1b2430;--card:#fff;--mut:#667;--ac:#0b6e4f;--bd:#dde1e7}
@media(prefers-color-scheme:dark){:root{--bg:#10151b;--fg:#e6eaf0;--card:#18202a;--mut:#9aa6b5;--ac:#3ec28f;--bd:#2b3644}}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{padding:14px 16px;border-bottom:1px solid var(--bd)}h1{margin:0;font-size:18px}
nav{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px}
button,input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
main{padding:0 16px 40px;max-width:980px;margin:auto}.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px;margin:10px 0}
.badge{font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--bd)}.mut{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}label{display:block;font-size:13px;color:var(--mut)}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:4px 6px;text-align:left;vertical-align:top}
.met{color:var(--ac)}.unmet{color:#c0392b}.unknown{color:var(--mut)}pre{white-space:pre-wrap;overflow:auto}
</style></head><body>
<header><h1>Global Pathways <span class="mut">· migration intelligence & advisory</span></h1>
<div class="mut" style="font-size:13px">Informational only. No visa, sponsorship or outcome is ever guaranteed. Always confirm on official sources.</div></header>
<nav id="nav"></nav><main id="main"></main>
<script>
const $=s=>document.querySelector(s),api=async(p,o={})=>{const r=await fetch('/api'+p,{headers:{'Content-Type':'application/json',...(localStorage.tok?{Authorization:'Bearer '+localStorage.tok}:{})},...o});if(!r.ok)throw new Error((await r.text()));return r.json()};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let aid=+localStorage.aid||null,tab='Countries';
const tabs={Countries,Opportunities,Account,Profile,Assessment,Matches,Applications,Advisor,Alerts,Safety,Staff};
function nav(){$('#nav').innerHTML=Object.keys(tabs).map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';nav()">${t}</button>`).join('');tabs[tab]().catch(e=>$('#main').innerHTML=`<div class=card>${esc(e.message)}</div>`)}

async function Account(){let me=null;try{me=await api('/auth/me')}catch(e){}
if(me){aid=me.applicant_id;if(aid)localStorage.aid=aid;return $('#main').innerHTML=`<div class=card><b>${esc(me.email)}</b> <span class=badge>${esc(me.role)}</span><div class=mut>Your data: you control sharing per field in Profile. <button onclick="exportMe()">Export my data</button> <button onclick="logout()">Log out</button></div><pre id=ex></pre></div>`}
$('#main').innerHTML=`<div class=card><label>Email</label><input id=em type=email><label>Password (10+ chars, upper-case + digit)</label><input id=pw type=password><p><button class=pri onclick="auth('login')">Log in</button> <button onclick="auth('register')">Register as applicant</button></p><div id=err class=unmet></div></div>`}
async function auth(k){try{const r=await api('/auth/'+k,{method:'POST',body:JSON.stringify({email:$('#em').value,password:$('#pw').value})});localStorage.tok=r.token;tab='Account';nav()}catch(e){$('#err').textContent=e.message}}
async function logout(){await api('/auth/logout',{method:'POST'});localStorage.clear();aid=null;nav()}
async function exportMe(){$('#ex').textContent=JSON.stringify(await api(`/applicants/${aid}/export`),null,2)}
async function Matches(){if(!aid)return $('#main').innerHTML='<div class=card>Log in and complete your profile first.</div>';const r=await api(`/applicants/${aid}/matches`);
$('#main').innerHTML=r.length?r.map(m=>`<div class=card><b>${esc(m.title)}</b> <span class=badge>${esc(m.country)}</span> <span class=badge>${esc(m.verification)}</span><div class=met>✓ ${m.met.map(esc).join(', ')||'—'}</div><div class=unmet>✗ ${m.gaps.map(esc).join(', ')||'—'}</div><div class=mut>${esc(m.note)}</div></div>`).join(''):'<div class=card>No verified opportunities match yet.</div>'}
async function Applications(){if(!aid)return $('#main').innerHTML='<div class=card>Log in first.</div>';const [apps,pw]=await Promise.all([api('/applications'),api('/pathways')]);
$('#main').innerHTML=`<div class=card><select id=pp>${pw.map(p=>`<option value="${esc(p.id)}">${esc(p.country)} · ${esc(p.name)}</option>`).join('')}</select> <button class=pri onclick=newApp()>Start preparing</button>
<div class=mut>Upload documents (PDF, DOCX, DOC, JPG, PNG; encrypted, private): <select id=dt>${['passport','cv','certificate','transcript','reference','police_clearance','medical','language_test','licence','offer_letter','other'].map(x=>`<option>${x}</option>`).join('')}</select> <input type=file id=fl> <button onclick=upDoc()>Upload</button></div></div>
${(await Promise.all(apps.map(async a=>{const [q,c]=await Promise.all([api(`/applications/${a.id}/quality`),api(`/applications/${a.id}/checklist`)]);return `<div class=card><b>${esc(a.pathway_id)}</b> <span class=badge>${esc(a.status)}</span> <span class=badge>${q.ready?'checks passed':'blockers'}</span>
<table>${c.checklist.map(i=>`<tr><td>${esc(i.requirement)}</td><td class="${i.status=='PROVIDED'?'met':'unmet'}">${i.status}</td></tr>`).join('')}</table>${q.issues.map(i=>`<div class=${i.severity=='blocker'?'unmet':'mut'}>${i.severity}: ${esc(i.message)}</div>`).join('')}
<div class=mut>${esc(q.disclaimer)}</div><button onclick="authz(${a.id})">I authorise preparation</button> <a href="${esc(c.official_url)}" target=_blank rel=noopener>Official application site</a> <span class=mut>You submit on the official site yourself, then record it here.</span></div>`}))).join('')}`}
async function newApp(){await api('/applications',{method:'POST',body:JSON.stringify({pathway_id:$('#pp').value})});nav()}
async function authz(i){await api(`/applications/${i}/authorize`,{method:'POST'});nav()}
async function upDoc(){const f=new FormData();f.append('doc_type',$('#dt').value);f.append('file',$('#fl').files[0]);const r=await fetch(`/api/applicants/${aid}/documents`,{method:'POST',headers:{Authorization:'Bearer '+localStorage.tok},body:f});if(!r.ok)alert(await r.text());nav()}
async function Countries(){const cs=await api('/countries?role=destination'),ps=await api('/pathways');
$('#main').innerHTML=cs.map(c=>`<div class=card><b>${esc(c.name)}</b> <span class=badge>${c.active?'active':'inactive'}</span> <span class="badge">rules ${c.last_verified?'verified '+c.last_verified:'unverified'}</span>
<div class=mut>${esc(c.config.authority||'')} · ${(c.config.official_sites||[]).map(u=>`<a href="${esc(u)}" target=_blank rel=noopener>${esc(u)}</a>`).join(', ')}</div>
<ul>${ps.filter(p=>p.country==c.iso2).map(p=>`<li>${esc(p.name)} <span class=mut>(${p.category}${p.last_verified?'':' · requirements unverified'})</span></li>`).join('')}</ul></div>`).join('')}
async function Opportunities(){$('#main').innerHTML=`<div class=card><div class=grid>
<div><label>Country (ISO2)</label><input id=fc></div><div><label>Nationality (ISO2)</label><input id=fn value="LR"></div>
<div><label>Occupation</label><input id=fo></div><div><label>Type</label><input id=fk placeholder="employer_sponsored"></div>
<div><label><input type=checkbox id=fs> sponsorship</label><label><input type=checkbox id=ff> no applicant fee</label></div></div>
<button class=pri onclick=searchOpp()>Search</button> <span class=mut>Only verified / partially verified, open listings are shown.</span></div><div id=res></div>`;searchOpp()}
async function searchOpp(){const q=new URLSearchParams();[['country','fc'],['nationality','fn'],['occupation','fo'],['kind','fk']].forEach(([k,i])=>$('#'+i).value&&q.set(k,$('#'+i).value));$('#fs').checked&&q.set('sponsorship','true');$('#ff').checked&&q.set('no_applicant_fee','true');
const r=await api('/opportunities?'+q);$('#res').innerHTML=r.length?r.map(o=>`<div class=card><b>${esc(o.title)}</b> <span class=badge>${esc(o.verification)}</span> <span class=badge>${esc(o.country)}</span><div class=mut>${esc(o.kind)} · sponsorship ${o.sponsorship} · applicant fee ${o.applicant_fee===null?'unknown':o.applicant_fee} · deadline ${o.deadline||'n/a'}</div>${o.url?`<a href="${esc(o.url)}" target=_blank rel=noopener>Official application link</a>`:''}</div>`).join(''):'<div class=card>No verified matches yet. An admin adds organizations, verifies them, then adds opportunities.</div>'}
const F=[['full_name','Full legal name'],['nationality','Nationality (ISO2, e.g. LR)'],['country_of_birth','Country of birth'],['residence','Current residence'],['dob','Date of birth (YYYY-MM-DD)'],['education.level','Education: none|primary|secondary|vocational|diploma|bachelor|master|doctorate'],['employment.total_years','Years of work experience'],['language.english_evidence','English test/evidence? (true/false)'],['documents.passport','Passport held? (true/false)'],['preferences.has_job_offer','Have job offer? (true/false)'],['financial.budget_usd','Budget (USD)']];
const setp=(o,p,v)=>{const k=p.split('.');k.slice(0,-1).forEach(x=>o=o[x]??={});o[k.at(-1)]=v};const getp=(o,p)=>p.split('.').reduce((a,k)=>a?.[k],o);
async function Profile(){if(!aid)return $('#main').innerHTML='<div class=card>Register or log in first (Account tab).</div>';const cur=aid?await api('/applicants/'+aid):{profile:{},consent:{}};
$('#main').innerHTML=`<div class=card><p class=mut>Collected once, used for all destinations. Nothing sensitive (passport number, medical) is asked here. Tick "share with advisor" per field; unticked fields stay private.</p><div class=grid>${F.map(([k,l])=>`<div><label>${l}</label><input data-k="${k}" value="${esc(getp(cur.profile,k)??'')}"><label><input type=checkbox data-c="${k.split('.')[0]}" ${['advisor','share'].includes(cur.consent[k.split('.')[0]])?'checked':''}> share with advisor</label></div>`).join('')}</div>
<button class=pri onclick=saveP()>Save profile</button> ${aid?`<button onclick="delP()">Delete my account & data</button> <span class=mut>Profile #${aid}</span>`:''}</div>`}
async function saveP(){const p={},c={};document.querySelectorAll('[data-k]').forEach(i=>{let v=i.value.trim();if(v==='')return;if(v==='true'||v==='false')v=v==='true';else if(!isNaN(v)&&!/^\d{4}-/.test(v))v=+v;setp(p,i.dataset.k,v)});document.querySelectorAll('[data-c]').forEach(i=>c[i.dataset.c]=i.checked?'advisor':'private');
await api('/applicants/'+aid,{method:'PUT',body:JSON.stringify({profile:p,consent:c})});tab='Assessment';nav()}
async function delP(){if(!confirm('Permanently delete your account, documents and applications?'))return;await api('/applicants/'+aid,{method:'DELETE'});localStorage.clear();aid=null;nav()}
async function Assessment(){if(!aid)return $('#main').innerHTML='<div class=card>Create a profile first.</div>';const r=await api(`/applicants/${aid}/assessment`);
$('#main').innerHTML=r.map(a=>`<div class=card><b>${esc(a.pathway)}</b> <span class=badge>${esc(a.country)}</span> <span class=badge>${esc(a.status)}</span> <span class=badge>readiness ${a.readiness_pct}%</span>
${a.warnings.map(w=>`<div class=unmet>⚠ ${esc(w)}</div>`).join('')}<table><tr><th>Requirement</th><th>Your info</th><th>Result</th><th>Action</th></tr>${a.requirements.map(q=>`<tr><td>${esc(q.requirement)}<div class=mut>${q.kind}</div></td><td>${esc(q.applicant_value??'—')}</td><td class=${q.result}>${q.result}</td><td>${esc(q.recommended_action)}</td></tr>`).join('')}</table>
<div class=mut>${esc(a.readiness_note)} <a href="${esc(a.official_url)}" target=_blank rel=noopener>Official source</a></div></div>`).join('')}
async function Advisor(){if(!aid)return $('#main').innerHTML='<div class=card>Create a profile first.</div>';const modes=['general','eligibility','jobs','scholarships','preparation','documents','interview','budget','comparison','progress'];
$('#main').innerHTML=`<div class=card><select id=mode>${modes.map(m=>`<option>${m}</option>`).join('')}</select> <input id=ac placeholder="country ISO2 (optional)" size=8> <button class=pri onclick=ask()>Ask</button><pre id=out class=mut>Advisor answers come from database records and the rules engine, using only fields you shared.</pre></div>`}
async function ask(){const r=await api(`/applicants/${aid}/advisor`,{method:'POST',body:JSON.stringify({mode:$('#mode').value,country:$('#ac').value||null})});$('#out').textContent=JSON.stringify(r,null,2)}

const act=(p,body,m='POST')=>api(p,{method:m,body:body?JSON.stringify(body):undefined}).then(()=>Staff(),e=>alert(e.message));
const kv=o=>Object.entries(o).filter(([k,v])=>typeof v!=='object').map(([k,v])=>`<span class=badge>${esc(k.replace(/_/g,' '))}: ${esc(v)}</span>`).join(' ');
async function Alerts(){let ns,pr;try{[ns,pr]=await Promise.all([api('/notifications'),api('/notification-prefs')])}catch(e){return $('#main').innerHTML='<div class=card>Log in to see alerts.</div>'}
$('#main').innerHTML=`<div class=card><b>Preferences</b><div class=mut>${esc(pr.note)}</div>${['email','opportunity_alerts','marketing'].map(k=>`<label><input type=checkbox ${pr[k]?'checked':''} onchange="api('/notification-prefs',{method:'PUT',body:JSON.stringify({${k}:this.checked})})"> ${k.replace('_',' ')}</label>`).join('')}</div>
${ns.map(n=>`<div class=card style="${n.read?'opacity:.6':''}"><b>${esc(n.title)}</b> ${n.critical?'<span class=badge>important</span>':''} <span class=badge>email: ${esc(n.email_status)}</span><div>${esc(n.body)}</div>${n.read?'':`<button onclick="api('/notifications/${n.id}/read',{method:'POST'}).then(Alerts)">Mark read</button>`}</div>`).join('')||'<div class=card>No notifications.</div>'}`}
async function Safety(){const n=await api('/safety-notices');$('#main').innerHTML=`<div class=card><b>Check an offer or message</b><div class=mut>Paste text you received. Nothing is stored.</div><textarea id=ft rows=5 style="width:100%"></textarea><button class=pri onclick=chk()>Check for warning signs</button><div id=fr></div></div>
<div class=card><b>Report a suspected scam</b><div class=mut>Log in required. Reports are reviewed by staff; no one is publicly labelled from a single report.</div><input id=rs placeholder="Who/what (name, website)"><select id=rc>${['fraudulent_organization','fake_job_offer','suspicious_recruiter','misleading_sponsorship','financial_scam','other'].map(x=>`<option>${x}</option>`).join('')}</select><textarea id=rd rows=3 style="width:100%" placeholder="What happened?"></textarea><button onclick=rep()>Submit report</button></div>
<div class=card><b>Always remember</b><ul>${n.notices.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`}
async function chk(){const r=await api('/fraud/check',{method:'POST',body:JSON.stringify({text:$('#ft').value})});$('#fr').innerHTML=(r.indicators.length?r.indicators.map(i=>`<div class=unmet>⚠ ${esc(i.why)}</div>`).join(''):'<div class=mut>No warning patterns found.</div>')+`<div class=mut>${esc(r.note)}</div>`}
async function rep(){try{const r=await api('/fraud/reports',{method:'POST',body:JSON.stringify({subject:$('#rs').value,category:$('#rc').value,description:$('#rd').value})});alert(r.note)}catch(e){alert(e.message)}}
async function Staff(){let d;try{d=await api('/admin/dashboard')}catch(e){return $('#main').innerHTML='<div class=card>Staff login with dashboard permission required (Account tab).</div>'}
const sec=async(p,f)=>{try{return f(await api(p))}catch(e){return ''}};
const cs=await sec('/cases',r=>`<div class=card><b>Cases (${r.length})</b><table><tr><th>ID</th><th>Stage</th><th>Assigned</th><th></th></tr>${r.map(c=>`<tr><td>${c.id}</td><td>${esc(c.stage)}</td><td>${c.assigned_to??'—'}</td><td><button onclick="openCase(${c.id})">Open</button></td></tr>`).join('')}</table><div id=cd></div></div>`);
const fr=await sec('/admin/fraud/reports?status=NEW',r=>`<div class=card><b>Fraud reports awaiting triage (${r.length})</b>${r.map(x=>`<div><b>${esc(x.subject)}</b> · ${esc(x.category)} · ${x.indicators.map(esc).join(', ')}<div>${esc(x.description)}</div><button onclick="act('/admin/fraud/reports/${x.id}',{status:'INVESTIGATING'})">Investigate</button> <button onclick="act('/admin/fraud/reports/${x.id}',{status:'DISMISSED',note:'dismissed'})">Dismiss</button></div>`).join('')}</div>`);
const rc=await sec('/admin/regulatory-changes',r=>`<div class=card><b>Regulatory changes to review (${r.length})</b>${r.map(x=>`<div>${esc(x.country)} · ${esc(x.policy_area)} · ${esc(x.summary)}<br><button onclick="act('/admin/regulatory-changes/${x.id}/review?decision=CONFIRMED_IMPACT')">Confirm impact</button> <button onclick="act('/admin/regulatory-changes/${x.id}/review?decision=NO_IMPACT')">No impact</button></div>`).join('')}</div>`);
const rl=await sec('/admin/research/results',r=>`<div class=card><b>Research leads awaiting review (${r.length})</b>${r.slice(0,20).map(x=>`<div>L${x.source_level} · <a href="${esc(x.url)}" target=_blank rel=noopener>${esc(x.title)}</a> <button onclick="act('/admin/research/results/${x.id}/review?decision=APPROVED')">Approve</button> <button onclick="act('/admin/research/results/${x.id}/review?decision=REJECTED')">Reject</button></div>`).join('')}</div>`);
const rs=await sec('/admin/research/sources',r=>`<div class=card><b>Research sources</b><table>${r.map(x=>`<tr><td>${esc(x.country)}</td><td>${esc(x.title)}</td><td>${x.stale?'<span class=unmet>stale</span>':'fresh'}</td><td><button onclick="act('/admin/research/sources/${x.id}/run')">Run now</button></td></tr>`).join('')}</table></div>`);
const oq=await sec('/admin/review-queue',q=>`<div class=card><b>Organization review queue (${q.length})</b>${q.map(o=>`<div>${esc(o.name)} · ${esc(o.status)} · confidence ${o.confidence}</div>`).join('')}</div>`);
const roles=['super_admin','agency_director','research_analyst','compliance_reviewer','applicant_advisor','recruitment_specialist','document_reviewer','finance_officer','support_officer','auditor'];
const st=await sec('/admin/staff',r=>`<div class=card><b>Staff (${r.length})</b><table>${r.map(x=>`<tr><td>${esc(x.email)}</td><td><select onchange="act('/admin/staff/${x.id}',{role:this.value},'PATCH')">${roles.map(o=>`<option ${o==x.role?'selected':''}>${o}</option>`).join('')}</select></td><td>${x.open_cases} cases</td><td><button onclick="act('/admin/staff/${x.id}',{active:${!x.active}},'PATCH')">${x.active?'Deactivate':'Reactivate'}</button></td></tr>`).join('')}</table></div>`);
const wf=await sec('/admin/workflows',r=>`<div class=card><b>Workflows</b><div class=mut>Editable via POST /api/admin/workflows (trigger, conditions, steps). Triggers: ${r.triggers.join(', ')}</div>${r.workflows.map(w=>`<div><b>${esc(w.name)}</b> <span class=badge>${esc(w.trigger)}</span> ${w.steps.map(s=>`<span class=badge>${esc(s.type)}</span>`).join('→')}</div>`).join('')}</div>`);
const wr=await sec('/admin/workflow-runs',r=>`<div class=card><b>Automation history</b><table>${r.slice(0,15).map(x=>`<tr><td>#${x.id}</td><td>${esc(x.status)}</td><td class=unmet>${esc(x.error)}</td><td>${x.status=='WAITING_APPROVAL'?`<button onclick="act('/admin/workflow-runs/${x.id}/decide?approve=true')">Approve</button> <button onclick="act('/admin/workflow-runs/${x.id}/decide?approve=false')">Reject</button>`:''}${x.status=='FAILED'?`<button onclick="act('/admin/workflow-runs/${x.id}/retry')">Retry</button>`:''}</td></tr>`).join('')}</table></div>`);
const au=await sec('/admin/audit?limit=15',a=>`<div class=card><b>Audit log (latest)</b><table>${a.map(x=>`<tr><td>${esc(x.ts)}</td><td>${esc(x.action)}</td><td>${esc(x.target)}</td></tr>`).join('')}</table></div>`);
const g=(t,o)=>`<div class=card><b>${t}</b><div>${kv(o)}</div></div>`;
$('#main').innerHTML=`<div class=grid>${g('Applicants',d.applicants)}${g('Cases',d.cases)}${g('Applications',d.applications)}${g('Organizations',d.organizations)}${g('Opportunities',d.opportunities)}${g('Research',d.research)}${g('Health',d.health)}</div><div class=mut>${esc(d.applications.note)} Generated ${esc(d.generated)}.</div>`+cs+fr+rc+rl+rs+oq+st+wf+wr+au}
async function openCase(id){const c=await api('/cases/'+id);$('#cd').innerHTML=`<div class=card><b>Case ${id}</b> <span class=badge>${esc(c.case.stage)}</span><div class=mut>Documents: ${c.documents.map(d=>esc(d.doc_type)).join(', ')||'none'} (content not shown)</div>
<div>${c.assessment.slice(0,6).map(a=>`<div>${esc(a.country)} · ${esc(a.pathway)} · ${esc(a.status)} · ${a.readiness_pct}%${a.definitive?'':' (preliminary)'}</div>`).join('')}</div>
<div><input id=ns placeholder="Stage name (e.g. PROFILE_COMPLETED)"> <button onclick="act('/cases/${id}/stage?stage='+$('#ns').value)">Set stage</button></div>
<div><input id=nn placeholder="Internal note"> <button onclick="act('/cases/${id}/notes',{body:$('#nn').value})">Add note</button></div>
<div><input id=nt placeholder="Task"> <button onclick="act('/cases/${id}/tasks',{title:$('#nt').value})">Add task</button></div>
${c.notes.map(n=>`<div class=mut>📝 ${esc(n.body)}</div>`).join('')}${c.tasks.map(n=>`<div>☐ ${esc(n.title)}</div>`).join('')}</div>`}
nav()
</script></body></html>
